name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: db-dashboard/backend/package.json

      - name: Install backend dependencies
        run: |
          cd db-dashboard/backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd db-dashboard/backend
          npx prisma generate

      - name: Run Backend Syntax Verification
        run: |
          cd db-dashboard/backend
          node --check server.js
          node --check middleware/auth.js
          node --check middleware/audit.js

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: db-dashboard/frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd db-dashboard/frontend
          npm install

      - name: Run Frontend Lint
        run: |
          cd db-dashboard/frontend
          npm run lint --if-present

      - name: Run Next.js Build
        run: |
          cd db-dashboard/frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://neurograph-db-backend.onrender.com
