name: Verified application CI
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: FastAPI tests and PostgreSQL database features
    # Standard Linux runners are free on the public source repository. The private
    # submission mirror skips hosted jobs to avoid consuming metered allowances.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: neurograph_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d neurograph_ci"
          --health-interval 10s --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime and application tests
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          python -m pip install './backend[test,deploy]'
      - name: Run API, model-contract and PostgreSQL regressions
        working-directory: backend
        env:
          PYTHONPATH: ..:.
          OMP_NUM_THREADS: '2'
          TEST_POSTGRES_URL: postgresql+psycopg://ci:disposable-ci-password@localhost:5432/neurograph_ci
        run: pytest
      - name: Check matched benchmark scientific contracts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
        run: python -m unittest ml.tests.test_matched_benchmark
  frontend:
    name: Next.js lint build and authentication tests
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: db-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-dashboard/frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_URL: https://neurograph-16-171-237-56.sslip.io
      - run: npm audit --omit=dev --audit-level=high
  container:
    name: Build deployable Docker image
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t neurograph-api:ci .
      - run: docker run --rm neurograph-api:ci python -c "from app.main import app; assert app.title == 'NeuroGraph-DB API'"
